services:
  - type: web
    name: edutrack
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: >-
      python -c "import zipfile; zipfile.ZipFile('edutrack-fastapi.zip').extractall('.')"
      && REQ=$(find . -name requirements.txt -not -path './.git/*' | head -n 1)
      && test -n "$REQ"
      && pip install -r "$REQ"
      && pip install cairosvg
    startCommand: python start_render.py
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
